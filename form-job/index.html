<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Job Application Form</title>
      <link rel="stylesheet" href="styles.css" />
   </head>
   <body>
      <main>
         <h1>Formulário de Trabalho</h1>
         <div class="container">
            <form>
               <label for="name"> Full Name: </label>
               <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Manoel Gomes"
                  required
               />

               <label for="email"> Email: </label>
               <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="canetablue@hotmail.com"
                  required
               />

               <label for="position"> Cargo: </label>
               <select id="position" name="position" required>
                  <option value="">Selecione um cargo</option>

                  <option value="desenvolvedor">Desenvolvedor</option>

                  <option value="marketing">Marketing</option>

                  <option value="administracao">Administração</option>

                  <option value="recursos-humanos">Recursos Humanos</option>
               </select>

               <fieldset class="radio-group">
                  <legend>Modallidade de Trabalho</legend>
                  <input
                     type="radio"
                     name="availability"
                     value="remoto"
                     id="remoto"
                  />
                  <label for="remoto" class="availability"> Remoto </label>

                  <input
                     type="radio"
                     name="availability"
                     value="presencial"
                     id="presencial"
                     checked
                  />
                  <label for="presencial" class="availability">
                     Presencial
                  </label>

                  <input
                     type="radio"
                     name="availability"
                     value="hibrido"
                     id="hibrido"
                  />
                  <label for="hibrido" class="availability"> Hibrido </label>
               </fieldset>
               <label for="message"> Carta de Apresentação </label>
               <textarea
                  id="message"
                  name="message"
                  rows="8"
                  cols="40"
                  placeholder="Digite aqui..."
                  required
               ></textarea>
               <button type="submit" value="enviar-info">
                  Enviar Informações
               </button>
            </form>
         </div>
      </main>
      <footer>
         <p>Copyright © 2026. Todos os direitos reservados.</p>
      </footer>
   </body>
</html>
