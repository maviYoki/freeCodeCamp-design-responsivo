<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <title>Selection Feature Page</title>
      <link rel="stylesheet" href="styles.css" />
   </head>

   <body>
      <div class="feature-card-container">
         <h1>Feature Selection</h1>
         <div class="check">
            <label class="feature-card">
               <div class="feature-info">
                  <b>Games</b>
                  <p>Video games and interactive entertainment.</p>
               </div>
               <input type="checkbox" name="interets" value="games" />
            </label>

            <label class="feature-card">
               <div class="feature-info">
                  <b>Movies & TV shows</b>
                  <p>Films, series, and other visual entertainment.</p>
               </div>
               <input type="checkbox" name="interets" value="movie" />
            </label>

            <label class="feature-card">
               <div class="feature-info">
                  <b>Books</b>
                  <p>Different genres, artists, and musical experiences.</p>
               </div>
               <input type="checkbox" name="interets" value="books" />
            </label>

            <label class="feature-card">
               <div class="feature-info">
                  <b>Music</b>
                  <p>Fiction, non-fiction, manga, and other literature.</p>
               </div>
               <input type="checkbox" name="interets" value="music" />
            </label>
         </div>
      </div>
   </body>
</html>
