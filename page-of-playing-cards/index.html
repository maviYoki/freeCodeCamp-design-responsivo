<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Playing Cards</title>
      <link rel="stylesheet" href="styles.css" />
   </head>

   <body>
      <h1>Junji Ito Playing Cards</h1>
      <main id="playing-cards">
         <div class="card">
            <div class="left black">
               <div>3</div>
               <div>♠</div>
            </div>
            <div class="middle">
               <img
                  class="junji-ito"
                  alt="Uzumaki"
                  src="https://i.pinimg.com/736x/0a/96/6c/0a966cfa2bc5d6266328dac1b9656cdd.jpg"
               />
               <h2 class="work-title">Uzumaki</h2>
            </div>
            <div class="right black">
               <div>3</div>
               <div>♠</div>
            </div>
         </div>

         <div class="card black">
            <div class="left">
               <div>A</div>
               <div>♣</div>
            </div>
            <div class="middle">
               <img
                  class="junji-ito"
                  alt="Souichi no Katte na Noroi"
                  src="https://i.pinimg.com/1200x/a0/36/36/a0363696f320ff59641ee8b5e9e76f7b.jpg"
               />
               <h2 class="work-title">Souichi no Katte na Noroi</h2>
            </div>
            <div class="right black">
               <div>A</div>
               <div>♣</div>
            </div>
         </div>
         <div class="card red">
            <div class="left">
               <div>2</div>
               <div>♥</div>
            </div>
            <div class="middle">
               <img
                  class="junji-ito"
                  alt="Fashion Model"
                  src="https://i.pinimg.com/736x/db/38/ee/db38ee2830eb16db2b4d4f01924903fa.jpg"
               />
               <h2 class="work-title">Fashion Model</h2>
            </div>
            <div class="right red">
               <div>2</div>
               <div>♥</div>
            </div>
         </div>

         <div class="card black">
            <div class="left">
               <div>3</div>
               <div>♠</div>
            </div>
            <div class="middle">
               <img
                  class="junji-ito"
                  alt="Nagai Yume"
                  src="https://i.pinimg.com/736x/f5/5b/4d/f55b4d0b5573385ecc37181d68f5fb4e.jpg"
               />
               <h2 class="work-title">Nagai Yume</h2>
            </div>
            <div class="right black">
               <div>4</div>
               <div>♠</div>
            </div>
         </div>
         <div class="card">
            <div class="left red">
               <div>7</div>
               <div>♥</div>
            </div>
            <div class="middle">
               <img
                  class="junji-ito"
                  alt="Yaneura no Nagai Kami"
                  src="https://i.pinimg.com/736x/37/a8/86/37a88601ab1b9459b6a477276061cbb4.jpg"
               />
               <h2 class="work-title">Yaneura no Nagai Kami</h2>
            </div>
            <div class="right red">
               <div>7</div>
               <div>♥</div>
            </div>
         </div>
      </main>
   </body>
</html>
