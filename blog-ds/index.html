                  Dark Souls Remastered e uma analogia a depressão

                  Em um mundo em ruínas, você morrerá incontáveis vezes, perderá
                  tudo e será testado constantemente. Mas, em Dark Souls
                  Remastered, cada derrota ensina algo novo — e continuar
                  avançando, mesmo sem esperança, é a verdadeira vitória...
